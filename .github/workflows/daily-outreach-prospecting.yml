name: Daily Outreach Prospecting

on:
  schedule:
    # Runs at 8:00 AM ET (UTC-4 in summer / UTC-5 in winter)
    # 12:00 UTC covers 8am ET (summer/EDT)
    - cron: '0 12 * * 1-5'
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  prospect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run daily outreach prospecting
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          timeout_minutes: 25
          prompt: |
            Run the daily outreach prospecting routine for Inclusify Studio.

            Search LinkedIn for 10 NEW outreach contacts using web search.
            Target these contact types:
            - Heads of talent, VP of partnerships, or founders at influencer marketing agencies with 5–50 employees
            - Influencer marketing managers or brand partnership leads at consumer brands in food & beverage, apparel, lifestyle, fitness, gaming, or home goods
            - Founders, heads of social, or influencer leads at PR agencies with 10–100 employees

            AVOID: Fortune 500 companies, WPP / IPG / Publicis / giant holding companies, hearing tech brands, accessibility brands, medical brands.

            For each contact collect: full name, company, job title, LinkedIn URL.

            Then go to the Outreach CRM in Notion at this database ID: 2e89c88af9ee8083bb18e9e74edb5d34
            Before adding anyone, query the existing CRM and skip any contact already listed (check by Lead Name and Company).

            Log each new contact with:
            - Lead Name: full name
            - Company: company name
            - Role / Title: job title
            - LinkedIn Profile: LinkedIn URL
            - Lead Type: Agency, Brand, or PR Agency
            - Outreach Status: Not Contacted
            - Outreach Channel: LinkedIn
            - Service Pitched: Influencer Marketing
            - Notes: "Prompt 1" for agencies, "Prompt 2" for brands, "Prompt 3" for PR agencies — plus a 1–2 sentence description of the contact and why they're a fit for Deaf/HoH creator campaigns.

            Stop at exactly 10 new contacts added.
